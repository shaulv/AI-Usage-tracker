name: ChatGPTUsageTracker
options:
  bundleIdPrefix: local.chatgptusagetracker
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"

targets:
  ChatGPTUsageCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/ChatGPTUsageCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.chatgptusagetracker.core
        PRODUCT_NAME: ChatGPTUsageCore
        GENERATE_INFOPLIST_FILE: true
        ENABLE_TESTABILITY: true
        DEFINES_MODULE: true
        OTHER_LDFLAGS: "$(inherited) -lsqlite3"

  ChatGPTUsageTracker:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
      - path: Sources/UI
    dependencies:
      - target: ChatGPTUsageCore
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.chatgptusagetracker.app
        PRODUCT_NAME: "AI Usage tracker"
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_CFBundleDisplayName: "AI Usage tracker"
        GENERATE_INFOPLIST_FILE: true
        ENABLE_APP_SANDBOX: false
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(BUILT_PRODUCTS_DIR)
        OTHER_LDFLAGS: "$(inherited) -lsqlite3"
    entitlements:
      path: ChatGPTUsageTracker.entitlements
      properties:
        com.apple.security.app-sandbox: false

  ChatGPTUsageCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ChatGPTUsageCoreTests
        excludes:
          - "Fixtures/**"
    resources:
      - path: Tests/ChatGPTUsageCoreTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: ChatGPTUsageCore
      - target: ChatGPTUsageTracker
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.chatgptusagetracker.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AI Usage tracker.app/Contents/MacOS/AI Usage tracker"
        BUNDLE_LOADER: "$(TEST_HOST)"
        OTHER_LDFLAGS: "$(inherited) -lsqlite3"

schemes:
  ChatGPTUsageTracker:
    build:
      targets:
        ChatGPTUsageCore: all
        ChatGPTUsageTracker: all
        ChatGPTUsageCoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ChatGPTUsageCoreTests

